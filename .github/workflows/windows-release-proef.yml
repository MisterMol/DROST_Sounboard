name: Windows 6.0 releaseproef

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-beta:
    runs-on: windows-2025
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4
      - name: Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: .NET 8 SDK voor Velopack CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Virtuele Python-omgeving maken
        shell: pwsh
        run: python -m venv .venv
      - name: Velopack CLI installeren
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Tests, EXE en Velopack-pakket bouwen
        shell: pwsh
        run: .\Bouw_Windows_Release.ps1 -GitHubRepository "https://github.com/${{ github.repository }}"
      - name: Installer en updatebestanden bewaren, nog niet publiceren
        uses: actions/upload-artifact@v4
        with:
          name: DrostSoundboard-6.0-Windows-beta-proef
          path: |
            release-velopack/*Setup.exe
            release-velopack/*full.nupkg
            release-velopack/RELEASES-beta
            release-velopack/releases.beta.json
            release-velopack/assets.beta.json
            release-velopack/SHA256SUMS.txt
          if-no-files-found: error
